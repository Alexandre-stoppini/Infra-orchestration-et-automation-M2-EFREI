# Environnement de développement.
#   kubectl apply -k deploy/overlays/dev
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: velocite-dev

resources:
  - ../../base

# La version de l'API en service aujourd'hui.
images:
  - name: velocite/api
    newTag: 2.1.0

