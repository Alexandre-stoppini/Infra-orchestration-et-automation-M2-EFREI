# Garage : stockage objet S3. Un seul noeud, données sur volume persistant.
#
# L'image ne contient que le binaire : elle tourne sous n'importe quel
# utilisateur, ici 10001. La sonde de disponibilité teste le port
# d'administration et non l'état du cluster Garage : avant le Job
# d'initialisation, Garage n'a pas de disposition (layout) et se déclare en
# mauvaise santé. Une sonde qui l'attendrait bloquerait le Job qui la crée.
apiVersion: v1
kind: Service
metadata:
  name: garage
spec:
  selector:
    app.kubernetes.io/name: garage
  ports:
    - {name: s3, port: 3900, targetPort: s3}
    - {name: admin, port: 3903, targetPort: admin}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
spec:
  serviceName: garage
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: garage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: garage
          image: mirror.gcr.io/dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
          imagePullPolicy: IfNotPresent
          command: [/garage, -c, /etc/garage/garage.toml, server]
          env:
            - name: GARAGE_RPC_SECRET
              valueFrom: {secretKeyRef: {name: velocite-garage, key: garage_rpc_secret}}
            - name: GARAGE_ADMIN_TOKEN
              valueFrom: {secretKeyRef: {name: velocite-garage, key: garage_admin_token}}
            - name: GARAGE_METRICS_TOKEN
              valueFrom: {secretKeyRef: {name: velocite-garage, key: garage_metrics_token}}
          ports:
            - {name: s3, containerPort: 3900}
            - {name: rpc, containerPort: 3901}
            - {name: admin, containerPort: 3903}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            tcpSocket: {port: admin}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: admin}
            periodSeconds: 15
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: donnees, mountPath: /var/lib/garage}
            - {name: config, mountPath: /etc/garage, readOnly: true}
      volumes:
        - name: config
          configMap:
            name: garage-config
  volumeClaimTemplates:
    - metadata:
        name: donnees
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
