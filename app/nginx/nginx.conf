# ---------------------------------------------------------------------------
# Frontal VéloCité v2 (image nginx sans privilège, ports 8080 et 8443).
#
# Par rapport au socle de Sécurité 1 :
#   - plus de route /logs/, plus de socket Docker monté, plus d'autoindex ;
#   - TLS 1.2 et 1.3 seulement, HTTP redirigé vers HTTPS, HSTS ;
#   - en-têtes de sécurité, version de nginx masquée ;
#   - connexion limitée à 10 tentatives par minute et par adresse ;
#   - corps de requête plafonné.
# ---------------------------------------------------------------------------

server_tokens off;
client_max_body_size 256k;
limit_req_zone $binary_remote_addr zone=connexion:10m rate=10r/m;

map $request_id $id_requete { default $request_id; }

log_format logfmt 'ts=$time_iso8601 level=info service=nginx event=requete '
                  'method=$request_method uri="$uri" code=$status '
                  'octets=$body_bytes_sent duree_s=$request_time '
                  'amont_s=$upstream_response_time ip=$remote_addr '
                  'request_id=$id_requete';

server {
    listen 8080 default_server;
    server_name _;
    # Déclaré au niveau server pour remplacer le format par défaut de l'image.
    access_log /dev/stdout logfmt;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location / { return 301 https://$host:8443$request_uri; }
}

server {
    listen 8443 ssl default_server;
    server_name _;
    access_log /dev/stdout logfmt;

    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'" always;

    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-Id      $id_requete;
    proxy_read_timeout 60s;
    # Un service sans pod ne refuse pas toujours la connexion : elle expire.
    # Sans ce réglage, nginx attend 60 s avant de répondre 504.
    proxy_connect_timeout 5s;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }

    location = /api/login {
        limit_req zone=connexion burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8080/login;
    }

    location /api/ {
        proxy_pass http://api:8080/;
    }

    location /ingest/ {
        proxy_pass http://ingest:8081/;
    }
}
